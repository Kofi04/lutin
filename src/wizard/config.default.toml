# Configuration de Little Wizard.
# Copié dans %APPDATA%\LittleWizard\config.toml au premier lancement. Modifiez-le
# là-bas, puis choisissez « Recharger la configuration » dans le menu du sorcier :
# aucun redémarrage n'est nécessaire.
#
# Les noms de sections et de clés restent en anglais : ce sont des identifiants,
# pas du texte affiché.

[appearance]
scale = 1.0                      # taille du sorcier, de 0.5 à 4.0
opacity = 0.96                   # opacité, de 0.2 à 1.0
offset_x = 0                     # décalage droite (+) / gauche (-)
offset_y = 0                     # décalage bas (+) / haut (-)
click_through_when_idle = false  # laisser les clics traverser vers la fenêtre du dessous

[hotkeys]
# Modificateurs : ctrl, alt, shift, win. Touches : a-z, 0-9, f1-f24,
# space, tab, escape, enter, insert, delete, home, end.
quick_note = "ctrl+alt+N"
clipboard = "ctrl+alt+V"
launcher = "ctrl+alt+Space"
toggle_avatar = "ctrl+alt+A"
capture_region = "ctrl+alt+S"   # sélectionner une zone de l'écran à montrer
ask_claude = "ctrl+alt+C"       # ouvrir la discussion avec Claude

# Pour montrer une fenêtre entière : Ctrl + glisser le sorcier dessus.
# Pour montrer une image : la déposer sur le sorcier.

[monitor]
enabled = true
interval_seconds = 3.0
cpu_busy = 65.0        # au-dessus, le sorcier a l'air occupé
cpu_stressed = 88.0    # au-dessus, il a l'air stressé
ram_stressed = 88.0
battery_low = 20       # en dessous, sur batterie, il a l'air fatigué

[claude]
enabled = true
# Au-delà de ce délai sans réponse de votre part, l'action est REFUSÉE.
# Le silence ne vaut pas accord.
permission_timeout_seconds = 110
# Claude peut modifier des fichiers et lancer des commandes, chaque action
# étant validée par vous dans le sorcier. Mettez false pour qu'il se contente
# de répondre.
allow_actions = true
# Read / Glob / Grep / WebFetch / WebSearch passent sans demander. Ces outils
# ne modifient rien, mais ils laissent Claude lire tous vos fichiers lisibles.
auto_approve_read_only = true

[clipboard]
enabled = true
max_entries = 200        # les entrées plus anciennes sont purgées automatiquement
max_text_length = 20000  # ignorer les textes plus longs (évite de stocker de gros collages)

# Entrées du lanceur. « target » accepte tout ce que la boîte Exécuter accepte :
# un exécutable, un document, un dossier, un raccourci shell: ou une URL.
# Ajoutez autant de blocs que vous voulez.
[[launcher]]
label = "VS Code"
target = "code"

[[launcher]]
label = "Terminal"
target = "wt.exe"

[[launcher]]
label = "Téléchargements"
target = "shell:Downloads"

[[launcher]]
label = "Claude"
target = "https://claude.ai"
