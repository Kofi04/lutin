[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lutin"
version = "0.1.0"
description = "Un petit compagnon de bureau pose sur la barre des taches Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "claude-agent-sdk==0.2.161"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "ruff>=0.6"]

[project.gui-scripts]
lutin = "lutin.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lutin = ["config.default.toml", "app.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
